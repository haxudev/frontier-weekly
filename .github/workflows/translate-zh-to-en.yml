name: Translate new zh content to en

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: translate-zh-to-en-${{ github.ref }}
  cancel-in-progress: true

jobs:
  translate:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message || '', '[skip translate]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect zh Markdown files to translate
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.before }}"
          HEAD="${{ github.sha }}"

          echo "Diff base=$BASE head=$HEAD"

          # Fallback for first push / missing base commit
          if [[ "$BASE" == "0000000000000000000000000000000000000000" ]] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            if git rev-parse "$HEAD^" >/dev/null 2>&1; then
              BASE="$(git rev-parse "$HEAD^")"
              echo "Base not available; fallback base=$BASE"
            else
              BASE=""
              echo "Base not available; will translate all tracked zh files"
            fi
          fi

          tmpfile="$(mktemp)"
          : > "$tmpfile"

          # Files changed (added/modified) in this push
          if [[ -n "$BASE" ]]; then
            git diff --name-only --diff-filter=AM "$BASE" "$HEAD" -- 'content/zh/*.md' >> "$tmpfile" || true
          else
            git ls-files -- 'content/zh/*.md' >> "$tmpfile" || true
          fi

          sort -u "$tmpfile" | sed '/^$/d' > added_zh_files.txt
          rm -f "$tmpfile"

          echo "Zh files to translate:" || true
          cat added_zh_files.txt || true
          COUNT=$(wc -l < added_zh_files.txt | tr -d ' ')
          echo "ADDED_ZH_COUNT=$COUNT" >> "$GITHUB_OUTPUT"

      - name: No zh changes; skip translation
        if: steps.detect.outputs.ADDED_ZH_COUNT == '0'
        run: |
          echo "No new/modified content/zh/*.md in this push; skipping translation."

      - name: Setup Node.js
        if: steps.detect.outputs.ADDED_ZH_COUNT != '0'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Translate zh files to content/en with GitHub Models (Copilot)
        if: steps.detect.outputs.ADDED_ZH_COUNT != '0'
        env:
          GITHUB_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          GITHUB_MODELS_ENDPOINT: ${{ vars.GITHUB_MODELS_ENDPOINT }}
          MODEL_ID: ${{ vars.MODEL_ID || 'gpt-5' }}
        run: |
          node scripts/translate-new-en-files.mjs added_zh_files.txt

      - name: Commit and push translated files
        if: steps.detect.outputs.ADDED_ZH_COUNT != '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/en/*.md || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-translate zh content to en [skip translate]"
            git pull --rebase
            git push
          fi