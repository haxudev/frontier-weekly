name: Translate new zh content to en

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  translate:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip translate]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect newly added zh Markdown files
        id: detect
        shell: bash
        run: |
          set -e
          BASE="${{ github.event.before }}"
          HEAD="${{ github.sha }}"
          echo "Diff base=$BASE head=$HEAD"
          # List added zh markdown files in this push
          git diff --name-status "$BASE" "$HEAD" | awk '$1=="A" && $2 ~ /^content\\/zh\\/.*\\.md$/ {print $2}' > added_zh_files.txt || true
          echo "Added zh files:" || true
          cat added_zh_files.txt || true
          COUNT=$(wc -l < added_zh_files.txt || echo 0)
          echo "ADDED_ZH_COUNT=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Copy new files to content/en
        if: steps.detect.outputs.ADDED_ZH_COUNT != '0'
        shell: bash
        run: |
          set -e
          mkdir -p content/en
          while read -r file; do
            [ -z "$file" ] && continue
            base=$(basename "$file")
            cp "$file" "content/en/$base"
            echo "Copied $file -> content/en/$base"
          done < added_zh_files.txt

      - name: Setup Node.js
        if: steps.detect.outputs.ADDED_ZH_COUNT != '0'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Translate copied files with GitHub Models (Copilot)
        if: steps.detect.outputs.ADDED_ZH_COUNT != '0'
        env:
          GITHUB_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
          GITHUB_MODELS_ENDPOINT: ${{ vars.GITHUB_MODELS_ENDPOINT }}
          MODEL_ID: ${{ vars.MODEL_ID }}
        run: |
          node scripts/translate-new-en-files.mjs added_zh_files.txt

      - name: Commit and push translated files
        if: steps.detect.outputs.ADDED_ZH_COUNT != '0'
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/en/*.md || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-copy & translate new zh content to en [skip translate]"
            git push
          fi